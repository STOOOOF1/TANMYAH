<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقات التنمية والتخطيط الاقتصادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302f;--teal:#0f5c5a;--teal2:#1b7f7a;--tealL:#e3f1ef;--gold:#b8892f;--goldL:#f7efdc;--bg:#f4f8f7;--muted:#5d6b6a;--line:#d6e5e2;--ok:#1f8a5b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
.wrap{max-width:620px;margin:0 auto;padding:16px 14px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:19px;font-weight:900;color:var(--teal);line-height:1.25}
header h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.icon-btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--teal)}
.overall{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.overall .row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:8px}
.overall .row span:last-child{color:var(--gold)}
.bar{height:9px;background:var(--tealL);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(to left,var(--gold),var(--teal2));border-radius:9px;transition:width .4s}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 6px 8px;text-align:center;font-weight:800;color:var(--teal);font-size:14px;position:relative}
.lv small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.lv .mini{height:4px;background:var(--tealL);border-radius:4px;margin-top:6px;overflow:hidden}
.lv .mini i{display:block;height:100%;background:var(--teal2)}
.lv.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.lv.on small{color:#cfe7e4}
.lv.on .mini{background:rgba(255,255,255,.25)}.lv.on .mini i{background:var(--goldL)}
.lv.done:not(.on){border-color:var(--ok)}
.lv.locked{opacity:.5}
.lv .badge{position:absolute;top:-7px;left:-5px;background:var(--ok);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,92,90,.10);border:1px solid var(--line);padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;min-height:330px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(to left,var(--teal),var(--gold))}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.chap{background:var(--goldL);color:#8a6418;font-weight:700;border-radius:20px;padding:3px 11px}
.count{color:var(--muted);font-weight:700}
.card h2{font-size:21px;font-weight:900;color:var(--teal);line-height:1.4}
.body{font-size:16.5px;line-height:1.85;flex:1}
.body b{color:var(--teal)}
.body ul,.body ol{padding-right:20px}
.body li{margin-bottom:3px}
.body .v{color:#8a6418;font-weight:700}
.body .k{background:var(--tealL);border-radius:6px;padding:0 6px;font-weight:700;color:var(--teal)}
.body table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:4px}
.body th{background:var(--teal);color:#fff;padding:5px 7px;text-align:right;font-weight:700}
.body td{border-bottom:1px solid var(--line);padding:5px 7px;vertical-align:top}
.done-tag{position:absolute;top:16px;left:16px;background:#e6f5ee;color:var(--ok);font-size:12px;font-weight:800;border-radius:20px;padding:3px 10px}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn{border-radius:15px;padding:14px 10px;font-size:16.5px;font-weight:800}
.btn.ok{background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(15,92,90,.25)}
.btn.ok:active{transform:scale(.98)}
.btn.later{background:#fff;color:var(--teal);border:1.5px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center}
.link{background:none;color:var(--muted);font-size:14px;font-weight:700;padding:6px}
.link:disabled{opacity:.35}
.finish{background:#fff;border-radius:22px;border:1px solid var(--line);padding:26px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.finish .big{font-size:46px}
.finish h2{color:var(--teal);font-size:22px;font-weight:900}
.finish p{color:var(--muted);line-height:1.8;font-size:15.5px}
.finish .btn{width:100%}
.sheet-bg{position:fixed;inset:0;background:rgba(10,40,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;max-height:82vh;border-radius:22px 22px 0 0;padding:16px;overflow:auto}
.sheet h3{color:var(--teal);font-weight:900;font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.item .st{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.item.d .st{background:var(--ok);border-color:var(--ok)}
.item.cur{background:var(--tealL);border-radius:10px}
.danger{background:#fbeaea;color:#9c3d3d;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;margin-top:12px;width:100%}
.confirm{display:none;gap:8px;margin-top:10px}
.confirm.show{display:flex}
.confirm button{flex:1;border-radius:12px;padding:10px;font-weight:800}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.anim{animation:pop .28s ease}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>بطاقات التنمية والتخطيط الاقتصادي<small>بطاقة تلو بطاقة · من الصورة الكبرى إلى الإتقان</small></h1>
    <button class="icon-btn" id="listBtn">☰ القائمة</button>
  </header>
  <div class="overall"><div class="row"><span>تقدّمك الكلي</span><span id="ovTxt"></span></div><div class="bar"><i id="ovBar"></i></div></div>
  <div class="levels" id="levels"></div>
  <div id="stage"></div>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const LEVELS=[
 {n:1,name:"الصورة الكبرى",hint:"الموضوعات الرئيسة"},
 {n:2,name:"المفاهيم",hint:"التعريفات والأفكار"},
 {n:3,name:"التفاصيل",hint:"القوائم والمقارنات"},
 {n:4,name:"الإتقان",hint:"الدقائق والشواهد"}
];
const C=[
/* ===== المستوى 1 (10) ===== */
[1,"المقدمة","ما التنمية الاقتصادية؟","عملية <b>شاملة</b> لرفع مستوى المعيشة وتحقيق الرفاهية بالاستخدام الأمثل للموارد.<br>هي <b>ليست مجرد زيادة في الناتج المحلي</b>، بل <span class='k'>تغيير هيكلي</span> في المجتمع والاقتصاد يعزز العدالة والإنتاجية والاستدامة."],
[1,"الفصل 2","النمو ليس هو التنمية","<b>النمو</b> = زيادة الناتج المحلي الإجمالي ← يركز على <span class='k'>الكمّ</span> والأرقام.<br><b>التنمية</b> = تحسين حياة الناس ← تُعنى بـ<span class='k'>الكيف</span>: جودة النمو واستدامته وعدالته، وتراعي الجوانب الاجتماعية والبيئية."],
[1,"الفصل 3","لماذا نسعى إلى التنمية؟","لأنها تحقق أهدافًا كبرى: <b>رفع مستوى المعيشة</b>، <b>تقليل الفقر</b>، <b>عدالة التوزيع</b>، <b>الابتكار</b>، <b>البنية التحتية</b>، <b>التعليم والصحة</b>.<br>وهي ركيزة <b>للاستقرار السياسي والاجتماعي</b> ولتحسين جودة الحياة."],
[1,"الفصل 4","سبع نظريات تفسر التنمية","كل نظرية تجيب عن سؤال: <b>ما محرّك التنمية؟</b><ul><li>سميث: حرية السوق</li><li>ماركس: الصراع الطبقي</li><li>شومبيتر: الابتكار</li><li>روستو: المراحل</li><li>الدفع القوي: الاستثمار الضخم</li><li>نوركس: النمو المتوازن</li><li>هيرشمان: النمو غير المتوازن</li></ul>"],
[1,"الفصل 5","أنواع التنمية والتنمية في الإسلام","للتنمية ثلاثة أنواع: <b>اقتصادية · اجتماعية · مستدامة</b>.<br>والتنمية في الإسلام <b>شاملة متوازنة</b>، غايتها <span class='k'>مقاصد الشريعة الخمسة</span>، و<b>الإنسان محورها وهدفها</b>."],
[1,"الفصول 6–8","التخلف الاقتصادي باختصار","حالة ضعف نمو وتراجع: معيشة ودخل منخفضان وموارد لا تُستغل جيدًا.<br><b>يُقاس</b> بمؤشرات كالناتج المحلي ودخل الفرد و<b>مؤشر التنمية البشرية</b>.<br><b>يُعالج</b> بالإنتاج والاستثمار، والتعليم والصحة، والعدالة، ومحاربة الفساد."],
[1,"الفصل 9","كيف يفسر الإسلام التخلف؟","ليس مشكلة مال وموارد فقط، بل <b>خلل في القيم والسلوك</b> و<b>تقصير في عمارة الأرض</b>.<br>له <b>5 أسباب</b> تقابلها <b>5 سبل للنهوض</b>، وهو <span class='k'>ليس قدرًا محتومًا</span>."],
[1,"الفصول 10، 11، 13","الاستراتيجية ومن يصنع التنمية","<b>الاستراتيجية</b>: خطة طويلة الأمد توجّه موارد الدولة نحو نمو شامل مستدام.<br>ويصنع التنمية ثلاثة فاعلين: <b>الدولة</b> و<b>المواطن</b> و<b>المؤسسات الخاصة</b>، ولكلٍّ دوره."],
[1,"الفصل 12","تمويل التنمية: إسلامي ووضعي","يتفق النظامان في <b>أهمية التمويل</b>، ويختلفان في المصدر والمنهج والقيم.<br><b>الإسلامي</b>: مشاركة في الربح والخسارة، والربا محرّم.<br><b>الوضعي</b>: قرض بفائدة ثابتة، والمقترض يتحمل المخاطر."],
[1,"الفصلان 14–15","التخطيط الاقتصادي وتجربة المملكة","<b>التخطيط</b>: تحديد مسبق للأهداف والمسارات لتحقيق التنمية بكفاءة.<br><b>في المملكة</b> مرحلتان: <b>الخطط الخمسية</b> (بناء البنية التحتية) ← <b>رؤية 2030</b> (تخطيط استراتيجي موجّه بالأداء)."],

/* ===== المستوى 2 (20) ===== */
[2,"الفصل 1","تعريف علم الاقتصاد","علم <b>اجتماعي</b> يدرس كيفية استخدام <b>الموارد المحدودة</b> لإشباع <b>حاجات الإنسان المتعددة</b> بأفضل شكل ممكن، من خلال <b>المقارنة بين الاستخدامات البديلة</b> لهذه الموارد."],
[2,"الفصل 1","تعريف الاقتصاد الإسلامي","منظومة من <b>القواعد والأصول الشرعية</b> المستمدة من القرآن والسنة، تهدف إلى بناء <b>نظام اقتصادي عادل</b> يحقق <b>الكفاية للأفراد</b> و<b>التنمية للمجتمع</b> في إطار القيم الإسلامية."],
[2,"الفصل 1","تعريف التنمية الاقتصادية","عملية تهدف إلى <b>رفع مستوى الدخل القومي</b> و<b>تحسين نوعية الحياة</b> عبر <span class='k'>التغيير الهيكلي</span> في الاقتصاد والمجتمع، وتشمل التقدم في <b>التعليم والصحة والإنتاج والعدالة الاجتماعية</b>."],
[2,"الفصل 2","النمو والتنمية: المقارنة الكاملة","<table><tr><th></th><th>النمو</th><th>التنمية</th></tr><tr><td><b>المفهوم</b></td><td>زيادة الناتج المحلي خلال فترة</td><td>تحسين المعيشة بزيادة الإنتاجية وعدالة التوزيع</td></tr><tr><td><b>التركيز</b></td><td>الكم والأرقام</td><td>جودة النمو واستدامته وعدالته</td></tr><tr><td><b>يراعي</b></td><td>الاقتصاد فقط</td><td>العوامل الاجتماعية والبيئية</td></tr></table>"],
[2,"الفصل 3","أهداف التنمية العشرة","<ol><li>تحسين مستوى المعيشة</li><li>تقليل الفقر</li><li>تعزيز النمو المستدام</li><li>توزيع عادل للثروات</li><li>تعزيز الابتكار والتقنية</li><li>تطوير البنية التحتية</li><li>تحسين التعليم</li><li>تعزيز المشاركة المجتمعية</li><li>زيادة الاستثمار</li><li>تحسين الصحة العامة</li></ol>"],
[2,"الفصل 3","أهمية التنمية الاقتصادية","ضرورية لـ: <b>تحسين المعيشة</b> و<b>زيادة الدخل</b> و<b>توفير فرص العمل</b> ← فتقل البطالة والفقر وتتعزز العدالة.<br>وتعزز <b>الابتكار والكفاءة الإنتاجية</b>، وتسهم في <b>الاستقرار السياسي والاجتماعي</b>.<br>إذن هي ركيزة لتحقيق الأهداف الاجتماعية والثقافية والاقتصادية."],
[2,"الفصل 4","نظرية آدم سميث (الكلاسيكية)","التنمية تتحقق بـ<b>حرية السوق والمنافسة</b>.<br>كل فرد يعمل لمصلحته الذاتية، فيتحقق تلقائيًا الصالح العام عبر <span class='k'>اليد الخفية</span>."],
[2,"الفصل 4","النظرية الماركسية","تفسر التنمية بـ<b>العلاقات الطبقية</b> و<b>الصراع بين العمال والرأسماليين</b>.<br>الرأسمالية تولّد التفاوت والفقر ← فتقوم <b>ثورة</b> تقيم نظامًا أعدل هو <b>الاشتراكية</b>."],
[2,"الفصل 4","نظرية شومبيتر (الابتكار)","<b>الابتكار</b> هو المحرك الأساسي للتنمية.<br>يقوم <b>رواد الأعمال</b> بإحداث <span class='k'>هدم بنّاء</span>: منتجات وتقنيات جديدة تحل محل القديمة."],
[2,"الفصل 4","نظرية روستو: مراحل النمو","تمر المجتمعات بمراحل محددة من التخلف إلى الازدهار:<ol><li>المجتمع التقليدي</li><li>التهيؤ للانطلاق</li><li>الانطلاق</li><li>التوجه نحو النضج الصناعي</li><li>الاستهلاك الجماهيري الواسع</li></ol>"],
[2,"الفصل 4","نظرية الدفع القوي (روزنشتاين-رودان)","التنمية تحتاج <b>دفعة استثمارية كبيرة ومتكاملة</b> لإخراج الاقتصاد من الركود.<br>المشاريع الصغيرة المتفرقة <b>لا تكفي</b>؛ بل يجب تحريك الاقتصاد عبر <b>استثمارات ضخمة متزامنة</b>."],
[2,"الفصل 4","المتوازن (نوركس) × غير المتوازن (هيرشمان)","<b>نوركس</b>: لا تقوم التنمية على قطاع واحد، بل <b>نمو متوازن في جميع القطاعات</b> لضمان الاستقرار.<br><b>هيرشمان</b>: تنطلق التنمية من <b>قطاعات استراتيجية محددة</b> تقود الاقتصاد، ثم تمتد آثارها تدريجيًا لبقية القطاعات."],
[2,"الفصل 5","أنواع التنمية الثلاثة","<b>الاقتصادية</b>: زيادة مستدامة في الدخل والإنتاج وتحسين الهيكل الاقتصادي.<br><b>الاجتماعية</b>: تطوير قدرات الأفراد في التعليم والصحة والثقافة، والعدالة والرفاه.<br><b>المستدامة</b>: تلبية حاجات الحاضر دون المساس بقدرة الأجيال القادمة، مع حفظ البيئة."],
[2,"الفصل 5","التنمية في الإسلام","عملية شاملة توازن بين الاقتصادي والاجتماعي والبيئي مع الالتزام بالأخلاق.<ul><li><b>غايتها</b>: حفظ الدين والنفس والعقل والنسل والمال</li><li><b>أسسها</b>: العمل، العدل، التكافل، الإحسان</li><li><b>محورها</b>: الإنسان</li></ul>"],
[2,"الفصل 6","تعريف التخلف ومظاهره","<b>التخلف</b>: ضعف النمو والتراجع الاقتصادي، يتمثل في انخفاض المعيشة والدخل وضعف استخدام الموارد.<br><b>مظاهره</b>:<ol><li>انتشار الفقر والبطالة</li><li>ضعف البنى التحتية</li><li>انخفاض الإنتاجية وتدني نصيب الفرد من الدخل</li></ol>"],
[2,"الفصل 6","مقاييس التخلف العشرة","<ol><li>الناتج المحلي الإجمالي GDP</li><li>دخل الفرد</li><li>معدل الفقر</li><li>معدل البطالة</li><li>مؤشر التنمية البشرية HDI</li><li>معدل الأمية</li><li>مؤشر الفساد</li><li>الوصول للخدمات الأساسية</li><li>معدل النمو السكاني</li><li>مؤشرات الصحة العامة</li></ol>"],
[2,"الفصل 9","أسباب التخلف في الفكر الإسلامي","<ol><li>الابتعاد عن الدين والقيم الأخلاقية</li><li>الكسل وترك العمل</li><li>الجهل وضعف التعليم</li><li>الظلم والفساد</li><li>الفرقة وضعف الوحدة</li></ol>"],
[2,"الفصل 9","سبل النهوض في ضوء الإسلام","<ol><li>الإيمان والعمل الصالح</li><li>العلم والتخطيط</li><li>العدالة الاجتماعية</li><li>العمل والإنتاج</li><li>التكافل والتعاون</li></ol>"],
[2,"الفصل 12","الفرق الجوهري في التمويل","يكمن في <b>المنطلقات الفكرية والقيمية</b> وفي التعامل مع <b>المال والربح والمخاطرة</b>:<br><b>الربا</b>: محرّم في الإسلام لأن المال لا يدرّ مالًا بلا مخاطرة أو عمل، وهو عنصر أساس في الوضعي.<br><b>المخاطر</b>: مشتركة في الإسلامي، ويتحملها المقترض وحده في الوضعي."],
[2,"الفصل 14","مفهوم التخطيط وأهميته","<b>التخطيط</b>: تحديد مسبق للأهداف والمسارات لتحقيق التنمية بكفاءة؛ يشمل التحليل والتنظيم والتوجيه والرقابة.<br><b>أهميته</b>: توحيد الجهود وتقليل الهدر · تحسين القرار · رفع الكفاءة · الميزة التنافسية والاستقرار · تسهيل التقييم."],

/* ===== المستوى 3 (30) ===== */
[3,"الفصل 4","مرتكزات نظرية آدم سميث","<ol><li><b>تقسيم العمل</b> يزيد الكفاءة والإنتاج.</li><li><b>تراكم رأس المال</b> شرط أساسي للنمو.</li><li><b>دور الدولة</b> يقتصر على الحماية والأمن وتطبيق العدالة.</li></ol>"],
[3,"الفصل 4","مرتكزات النظرية الماركسية","<ol><li><b>فائض القيمة</b> هو مصدر الربح في الرأسمالية.</li><li>التنمية الحقيقية تتحقق بـ<b>إلغاء الاستغلال الطبقي</b>.</li><li>المجتمع العادل ينتج من <b>توزيع الثروة على أسس جماعية</b>.</li></ol>"],
[3,"الفصل 4","مرتكزات نظرية شومبيتر","<ol><li>الابتكار يولّد <b>نموًا اقتصاديًا متسارعًا</b>.</li><li>دور <b>رجل الأعمال محوري</b> في التطور الاقتصادي.</li><li><b>الاستثمار في المعرفة والتقنية</b> أساس التنمية المستدامة.</li></ol>"],
[3,"الفصل 4","مرتكزات نظرية الدفع القوي","<ol><li>ضرورة <b>التخطيط المركزي</b> للتنمية.</li><li><b>الترابط بين القطاعات</b> يضاعف الأثر الاقتصادي.</li><li><b>الاستثمار في البنية التحتية</b> يحفز بقية الأنشطة.</li></ol>"],
[3,"الفصل 4","مرتكزات النمو المتوازن (نوركس)","<ol><li>التوازن بين <b>الإنتاج والاستهلاك</b>.</li><li>تحفيز الاستثمار في <b>الصناعة والزراعة والخدمات معًا</b>.</li><li>تجنب <b>الاعتماد المفرط على قطاع واحد</b> مثل النفط أو الزراعة فقط.</li></ol>"],
[3,"الفصل 4","مرتكزات النمو غير المتوازن (هيرشمان)","<ol><li>الموارد محدودة، فتُركّز في <b>قطاعات ذات أثر مضاعف</b>.</li><li>النمو يبدأ من <b>بؤر اقتصادية</b> تقود التحول البنيوي.</li><li><b>اللامركزية والتمييز</b> في توزيع الاستثمارات يسرّعان النمو.</li></ol>"],
[3,"الفصل 4","المحرك الأساسي لكل نظرية","<table><tr><td><b>سميث</b></td><td>حرية السوق وتراكم رأس المال</td></tr><tr><td><b>ماركس</b></td><td>الصراع الطبقي وتوزيع الثروة</td></tr><tr><td><b>شومبيتر</b></td><td>الابتكار وريادة الأعمال</td></tr><tr><td><b>روستو</b></td><td>المراحل التاريخية للنمو</td></tr><tr><td><b>الدفع القوي</b></td><td>الاستثمار الكبير المتزامن</td></tr><tr><td><b>المتوازن</b></td><td>نمو متزامن في القطاعات</td></tr><tr><td><b>غير المتوازن</b></td><td>قطاعات محركة للنمو</td></tr></table>"],
[3,"الفصل 4","دور الدولة في كل نظرية","<table><tr><td><b>سميث</b></td><td>محدود (تنظيم وعدالة)</td></tr><tr><td><b>ماركس</b></td><td>قوي (تملك وسائل الإنتاج)</td></tr><tr><td><b>شومبيتر</b></td><td>داعم للابتكار</td></tr><tr><td><b>روستو</b></td><td>موجّه وداعم للبنية</td></tr><tr><td><b>الدفع القوي</b></td><td>تخطيط مركزي قوي</td></tr><tr><td><b>المتوازن</b></td><td>منسّق وموجّه</td></tr><tr><td><b>غير المتوازن</b></td><td>محفّز ومركّز</td></tr></table>"],
[3,"الفصل 4","سمة النمو في كل نظرية","<table><tr><td><b>سميث</b></td><td>طبيعي تدريجي</td></tr><tr><td><b>ماركس</b></td><td>تحوّل جذري</td></tr><tr><td><b>شومبيتر</b></td><td>متقطع وديناميكي</td></tr><tr><td><b>روستو</b></td><td>تدريجي متسلسل</td></tr><tr><td><b>الدفع القوي</b></td><td>قفزات تنموية</td></tr><tr><td><b>المتوازن</b></td><td>مستقر ومنتظم</td></tr><tr><td><b>غير المتوازن</b></td><td>انتقائي وانتشاري</td></tr></table>"],
[3,"الفصل 7","معالجة التخلف الاقتصادي","<ol><li><b>زيادة الإنتاج والاستثمار</b>: بتطوير البنية التحتية والتقنيات.</li><li><b>تحسين المعيشة</b>: برفع الدخل وتوفير الخدمات الاجتماعية.</li><li><b>التعليم والصحة</b>: لتأهيل القوى العاملة.</li><li><b>العدالة الاجتماعية</b>: بتوزيع الثروة وتقليل الفوارق.</li><li><b>الاستقرار المؤسسي</b>: بمحاربة الفساد ورفع كفاءة الإدارة.</li></ol>"],
[3,"الفصل 8","تصنيف الدول اقتصاديًا","تُصنّف وفق <b>الدخل القومي الفردي</b> إلى:<ol><li>دول منخفضة الدخل</li><li>دول متوسطة الدخل (<b>دنيا وعليا</b>)</li><li>دول مرتفعة الدخل</li></ol>"],
[3,"الفصل 8","مؤشر التنمية البشرية HDI","يقيس مستوى التنمية بالجمع بين:<br><span class='k'>الدخل</span> + <span class='k'>التعليم</span> + <span class='k'>متوسط العمر</span><br>وهو <b>المقياس المعتمد لدى الأمم المتحدة</b>، وأشمل مقاييس التخلف."],
[3,"الفصل 9","مفهوم التخلف في المنظور الإسلامي","ليس مجرد نقص في المال والموارد، بل <b>خلل في القيم والسلوك والمنهج الإنساني</b> و<b>تقصير في عمارة الأرض</b>.<br><span class='v'>﴿هُوَ أَنشَأَكُم مِّنَ الْأَرْضِ وَاسْتَعْمَرَكُمْ فِيهَا﴾</span> [هود: 61]<br>أي: طلب منكم عمارتها بالعمل والعلم والإنتاج والإصلاح."],
[3,"الفصل 10","الاستراتيجية ومتطلباتها","<b>المفهوم</b>: خطة طويلة الأمد توجّه موارد الدولة نحو النمو الشامل والمستدام.<br><b>المتطلبات</b>:<ol><li>تحليل البيئة الاقتصادية والمنافسة</li><li>صياغة الأهداف والسياسات</li><li>تنفيذ البرامج وفق جداول زمنية</li><li>التقييم المستمر وتعديل المسار</li></ol>"],
[3,"الفصل 10","مكونات الاستراتيجية الناجحة","<ol><li>تنمية <b>رأس المال البشري</b> والتعليم.</li><li>تحسين <b>بيئة الأعمال</b> والإنتاج.</li><li>الاستثمار في <b>الطاقة والبيئة المستدامة</b>.</li></ol>"],
[3,"الفصل 11","أساليب تحقيق التنمية","<ol><li><b>الرؤية الواضحة</b>: أهداف واقعية بمشاركة المجتمع.</li><li><b>الإدارة الفعالة</b>: تنظيم العمل وتوزيع المسؤوليات.</li><li><b>بناء القدرات</b>: التدريب وتنمية المهارات.</li><li><b>الابتكار والإبداع</b>: الأفكار والمشاريع الريادية.</li><li><b>الثقافة التنموية</b>: قيم العمل والشفافية والتكافل.</li></ol>"],
[3,"الفصل 13","دور الدولة في التنمية","<ol><li>وضع <b>السياسات الاقتصادية</b>.</li><li>تطوير <b>البنية التحتية</b>.</li><li>دعم <b>التعليم والبحث والابتكار</b>.</li></ol>للحفظ: الدولة <b>تخطط وتبني وتدعم</b>."],
[3,"الفصل 13","دور المواطن في التنمية","<ol><li>المشاركة في <b>العمل والإنتاج</b>.</li><li><b>ترشيد الاستهلاك والادخار</b>.</li><li>الالتزام بـ<b>القيم الوطنية والاجتماعية</b>.</li></ol>للحفظ: المواطن <b>يعمل ويرشّد ويلتزم</b>."],
[3,"الفصل 13","دور المؤسسات الخاصة","<ol><li><b>الاستثمار</b> في المشاريع المنتجة.</li><li>الالتزام بـ<b>المسؤولية الاجتماعية</b>.</li><li>المساهمة في <b>حماية البيئة</b> والتنمية المستدامة.</li></ol>"],
[3,"الفصل 12","مفهوم تمويل التنمية","توفير <b>الموارد المالية</b> اللازمة لتنفيذ المشروعات الاقتصادية والاجتماعية التي ترفع المعيشة وتحقق النمو المستدام.<br>تتفق النظم في <b>أهمية التمويل</b>، وتختلف في: <span class='k'>المصدر</span> <span class='k'>المنهج</span> <span class='k'>القيم الحاكمة</span>."],
[3,"الفصل 12","أوجه التشابه بين التمويلين","<ol><li><b>الغاية المشتركة</b>: تحريك رأس المال وتشجيع الاستثمار.</li><li><b>صورة التمويل</b>: المال من جانب والعمل من جانب غالبًا، وللعامل إدارة المال حسب الاتفاق.</li><li><b>تنويع المصادر</b>: مدخرات، استثمارات، مؤسسات مالية، شراكات.</li><li><b>تشجيع الادخار والاستثمار</b> وتوجيهه لأنشطة منتجة.</li></ol>"],
[3,"الفصل 12","خلاصة المقارنة في التمويل","<table><tr><th>المعيار</th><th>الإسلامي</th><th>الوضعي</th></tr><tr><td><b>الهدف</b></td><td>التنمية الشاملة والعدالة</td><td>أقصى ربح</td></tr><tr><td><b>الأداة</b></td><td>المشاركة والتمويل الأخلاقي</td><td>القروض والفوائد</td></tr><tr><td><b>المخاطر</b></td><td>مشتركة</td><td>على المقترض</td></tr><tr><td><b>التوزيع</b></td><td>عادل ومتكافل</td><td>غير منضبط بالقيم</td></tr></table>"],
[3,"الفصل 14","أنواع التخطيط","<table><tr><td><b>باعتبار الرسمية</b></td><td>رسمي · غير رسمي</td></tr><tr><td><b>باعتبار المدة</b></td><td>قصير · متوسط · طويل المدى</td></tr><tr><td><b>باعتبار الغرض</b></td><td>استراتيجي · تشغيلي · دائم · للاستخدام الواحد</td></tr></table>"],
[3,"الفصل 14","دور التخطيط في تحقيق التنمية","<ol><li><b>تحديد الأهداف</b> واضحة وقابلة للقياس.</li><li><b>توزيع الموارد</b> توزيعًا أمثل يحد من الهدر.</li><li><b>التنبؤ بالمستقبل</b>: الاحتياجات والتحديات.</li><li><b>التنسيق</b> بين الجهات الحكومية والخاصة.</li><li><b>الاستجابة للتغيرات</b> بمرونة.</li><li><b>المراقبة والتقييم</b> وتعديل الاستراتيجيات.</li></ol>"],
[3,"الفصل 14","التخطيط في المنهج الإسلامي","<ol><li><b>رؤية شاملة</b> متماشية مع القيم وتهدف للخير العام.</li><li><b>التوكل على الله</b> مع بذل الجهد.</li><li><b>التفكر والتأمل</b> قبل القرار.</li><li><b>الاستشارة</b> لذوي الخبرة.</li><li><b>المرونة</b> والتكيف مع المتغيرات.</li><li><b>التقييم</b> ومراجعة الأداء.</li></ol>"],
[3,"الفصل 14","الضوابط الشرعية للتخطيط","<ol><li>الربط بين <b>الدنيا والآخرة</b> في الأهداف.</li><li>ربط التخطيط بـ<b>التوكل على الله</b>.</li><li>التقيد بضابط <b>الحلال والحرام</b>.</li><li>الالتزام بـ<b>الضوابط الأخلاقية</b>.</li><li><b>الشورى والتعاون</b>.</li></ol>تضمن توافق التخطيط مع القيم وتحقيق المصلحة العامة."],
[3,"الفصل 14","مراحل التخطيط الست","<ol><li>تحديد الأهداف</li><li>تحليل وتقييم الظروف البيئية</li><li>تحديد البدائل</li><li>تقييم البدائل</li><li>اختيار البديل الأمثل</li><li>تقييم النتائج والتعديل</li></ol>"],
[3,"الفصل 14","أساليب التخطيط الثلاثة","<ol><li><b>أسلوب الموازين</b>: سلعية، قيمية، قوى عاملة.</li><li><b>أسلوب المدخلات والمخرجات</b>: تحليل التشابك بين القطاعات.</li><li><b>أسلوب البرمجة الخطية</b>: أسلوب رياضي لإيجاد الحل الأمثل.</li></ol>"],
[3,"الفصل 15","المرحلة الأولى: الخطط الخمسية","بدأت في <b>أواخر القرن الرابع عشر الهجري</b> واستمرت <b>عشر خطط</b>.<br><b>هدفها</b>: بناء البنية التحتية (مطارات، موانئ، مستشفيات، جامعات، طرق سريعة).<br><b>أسلوبها</b>: الموازين، والمحرك الإنفاق العام الممول من النفط.<br><b>نتيجتها</b>: اكتمال البنية التحتية والأساس للمرحلة التالية."],
[3,"الفصل 15","المرحلة الثانية: رؤية 2030","من <b>2016م حتى الآن</b>؛ انطلاقة جديدة وخارطة طريق شاملة.<br>تحوّل من <b>تخطيط موجّه بالإنفاق</b> إلى <b>تخطيط استراتيجي موجّه بالأداء</b>.<br><b>محاورها</b>: مجتمع حيوي · اقتصاد مزدهر · وطن طموح."],

/* ===== المستوى 4 (40) ===== */
[4,"الفصل 3","الأهداف 1–5 بالتفصيل","<ol><li><b>المعيشة</b>: زيادة الدخل وتوفير التعليم والرعاية الصحية.</li><li><b>الفقر</b>: برامج اجتماعية للأكثر احتياجًا وفرص عمل.</li><li><b>النمو المستدام</b>: نمو يحافظ على الموارد الطبيعية.</li><li><b>عدالة التوزيع</b>: تقليل الفجوات بين فئات المجتمع.</li><li><b>الابتكار</b>: البحث والتطوير لزيادة الإنتاجية.</li></ol>"],
[4,"الفصل 3","الأهداف 6–10 بالتفصيل","<ol start='6'><li><b>البنية التحتية</b>: الطرق والمواصلات والطاقة.</li><li><b>التعليم</b>: تلبية احتياجات سوق العمل والمهارات الحديثة.</li><li><b>المشاركة المجتمعية</b>: إشراك المجتمع في القرارات التنموية.</li><li><b>الاستثمار</b>: جذب المحلي والأجنبي.</li><li><b>الصحة العامة</b>: الرعاية والوقاية لزيادة الإنتاجية.</li></ol>"],
[4,"المقدمة","ثلاث قيم يعززها التغيير الهيكلي","في المقدمة: التنمية تغيير هيكلي يعزز:<br><span class='k'>العدالة</span> <span class='k'>الإنتاجية</span> <span class='k'>الاستدامة</span><br>وفي تعريف الفصل الثاني: <b>النمو يركز على الكم، والتنمية تُعنى بجودة النمو واستدامته وعدالته</b>."],
[4,"الفصل 4","سميث بدقة","تحقيق المصلحة العامة يحدث <b>تلقائيًا</b> من سعي الفرد لمصلحته الذاتية ← «اليد الخفية».<br>الدولة: <b>حماية وأمن وعدالة</b> فقط (دور محدود).<br>سمة النمو عنده: <b>طبيعي تدريجي</b>."],
[4,"الفصل 4","ماركس بدقة","النتيجة عنده: <b>ثورة</b> تقيم نظامًا أعدل = <b>الاشتراكية</b>.<br>الدولة: دور <b>قوي</b> بتملك وسائل الإنتاج.<br>سمة النمو: <b>تحوّل جذري</b>.<br>مفتاحه: <span class='k'>فائض القيمة</span> مصدر الربح الرأسمالي."],
[4,"الفصل 4","روستو: المرحلتان 1 و2","<b>1. المجتمع التقليدي</b>: اقتصاد <b>زراعي بسيط</b>.<br><b>2. التهيؤ للانطلاق</b>: مرحلة <b>تكوين البنية الاقتصادية</b>."],
[4,"الفصل 4","روستو: مرحلة الانطلاق","<b>3. الانطلاق</b>: <span class='k'>نقطة التحول</span> نحو <b>النمو السريع</b>.<br>وهي المرحلة الوسطى بين التهيؤ والنضج.<br>دور الدولة عند روستو: <b>موجّه وداعم للبنية</b>، وسمة النمو <b>تدريجي متسلسل</b>."],
[4,"الفصل 4","روستو: المرحلتان 4 و5","<b>4. التوجه نحو النضج</b>: النضج <b>الصناعي</b>.<br><b>5. الاستهلاك الجماهيري الواسع</b>: آخر المراحل وقمة الازدهار."],
[4,"الفصل 4","لا تخلط: الدفع القوي × المتوازن","كلاهما يؤمن بـ<b>التزامن</b> وبعدم كفاية الجهود الجزئية، لكن:<br><b>الدفع القوي</b>: يركز على <b>حجم</b> الاستثمار وضخامته + <b>تخطيط مركزي قوي</b> ← قفزات تنموية.<br><b>المتوازن</b>: يركز على <b>توازن القطاعات</b> والإنتاج والاستهلاك ← نمو مستقر ومنتظم."],
[4,"الفصل 4","هيرشمان بدقة","الدولة عنده: <b>محفّز ومركّز</b> للاستثمار في قطاعات بعينها.<br>سمة النمو: <b>انتقائي</b> (يبدأ من قطاعات مختارة) ثم <b>انتشاري</b> (يمتد لغيرها).<br>مثال الفكرة: قطاع قائد ذو أثر مضاعف يجرّ بقية الاقتصاد."],
[4,"الفصل 6","مقياس الناتج المحلي الإجمالي","<b>GDP</b>: يقيس <b>إجمالي قيمة السلع والخدمات المنتجة</b> في الدولة.<br>ويُعدّ <b>مؤشرًا رئيسًا على النشاط الاقتصادي</b>."],
[4,"الفصل 6","دخل الفرد ومعدل الفقر","<b>دخل الفرد</b>: متوسط دخل الأفراد ← يعكس <b>مستوى المعيشة</b>.<br><b>معدل الفقر</b>: نسبة من يعيشون <b>تحت خط الفقر</b> ← يدل على <b>توزيع الثروة</b> ومستوى الرفاهية."],
[4,"الفصل 6","البطالة والأمية","<b>معدل البطالة</b>: نسبة <b>القادرين على العمل غير الموظفين</b> ← يعكس حالة سوق العمل.<br><b>معدل الأمية</b>: نسبة من <b>لا يستطيعون القراءة والكتابة</b> ← يعكس مستوى التعليم."],
[4,"الفصل 6","الفساد والخدمات الأساسية","<b>مؤشر الفساد</b>: مستوى الفساد في <b>المؤسسات الحكومية</b>، ويؤثر سلبًا في التنمية.<br><b>الوصول للخدمات الأساسية</b>: التعليم والرعاية الصحية و<b>المياه النظيفة</b> ← يعكس الرفاهية العامة."],
[4,"الفصل 6","النمو السكاني ومؤشرات الصحة","<b>النمو السكاني</b>: يزيد التخلف إذا كان <b>سريعًا دون توفير الموارد</b> اللازمة.<br><b>مؤشرات الصحة العامة</b>: مثل <b>وفيات الأطفال</b> و<b>متوسط العمر المتوقع</b> ← تعكس صحة السكان وتوفر الخدمات الصحية."],
[4,"الخاتمة","خاتمة المذكرة","التنمية ليست هدفًا اقتصاديًا فحسب، بل <b>مشروع إنساني وحضاري</b> يتكامل فيه الاقتصاد مع القيم، والعلم مع العدالة.<br>وفي المنظور الإسلامي: <b>مسؤولية جماعية</b> تقوم على العمل الصالح والعلم والعدل، وغايتها <span class='k'>إعمار الأرض وخدمة الإنسان</span>."],
[4,"الفصل 9","السبب 1: البعد عن الدين والقيم","حين يُهمل الناس قيم الإسلام في العمل ويضعفون في <b>الأمانة والإتقان</b> ← <b>تُرفع البركة</b> ويحل الضعف الاقتصادي.<br><span class='v'>﴿وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِم بَرَكَاتٍ مِّنَ السَّمَاءِ وَالْأَرْضِ﴾</span> [الأعراف: 96]"],
[4,"الفصل 9","السبب 2: الكسل وترك العمل","الإسلام <b>يربط الرزق بالسعي</b>؛ فترك السعي سبب رئيس للفقر.<br><span class='v'>﴿فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ﴾</span> [الملك: 15]<br><b>العمل عبادة</b>، والكسل من مظاهر التخلف الحضاري."],
[4,"الفصل 9","السبب 3: الجهل وضعف التعليم","العلم <b>أساس القوة والتقدم</b>، والجهل سبب للضلال والتراجع.<br><span class='v'>﴿قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾</span> [الزمر: 9]<br>كل أمة تهمل التعليم والبحث تفقد مكانتها."],
[4,"الفصل 9","السبب 4: الظلم والفساد","الظلم <b>يُهلك الأمم ولو كانت غنية</b>؛ لأنه يهدم الثقة ويضعف العدالة.<br><span class='v'>﴿وَتِلْكَ الْقُرَىٰ أَهْلَكْنَاهُمْ لَمَّا ظَلَمُوا﴾</span> [الكهف: 59]<br>الفساد الإداري والمالي يكدّس الثروة بيد القلة ويحرم الأكثرية."],
[4,"الفصل 9","السبب 5: الفرقة وضعف الوحدة","الاجتماع <b>أساس القوة</b>، والانقسام يورث الضعف.<br><span class='v'>﴿وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ وَاصْبِرُوا﴾</span> [الأنفال: 46]<br>حين تنقسم الأمة إلى مصالح متعارضة تفقد طاقتها الإنتاجية."],
[4,"الفصل 9","كل سبب يقابله سبيل","<table><tr><th>السبب</th><th>السبيل</th></tr><tr><td>البعد عن الدين</td><td>الإيمان والعمل الصالح</td></tr><tr><td>الكسل</td><td>العمل والإنتاج</td></tr><tr><td>الجهل</td><td>العلم والتخطيط</td></tr><tr><td>الظلم والفساد</td><td>العدالة الاجتماعية</td></tr><tr><td>الفرقة</td><td>التكافل والتعاون</td></tr></table>"],
[4,"الفصل 9","سبيل العدالة الاجتماعية","الإسلام يحقق العدالة بـ<b>توزيع الثروة</b> و<b>منع الاحتكار</b>،<br>ويحض على <span class='k'>الإنفاق</span> <span class='k'>الصدقة</span> <span class='k'>الوقف</span> بوصفها <b>آليات تنموية</b>."],
[4,"الفصل 9","الإيمان والعمل · العمل والإنتاج","<b>الإيمان والعمل الصالح</b>: الجمع بين العقيدة الصحيحة والعمل المنتج؛ فالإيمان وحده لا يكفي دون عمل.<br><b>العمل والإنتاج</b>: تشجيع كل عمل نافع يضيف قيمة من الزراعة إلى الصناعة والخدمات؛ لأن <b>خير الكسب عمل الرجل بيده</b>."],
[4,"الفصل 12","الاختلاف في الأساس الفكري","<b>الإسلامي</b>: يستمد قواعده من <b>الشريعة ومقاصدها</b> في تحقيق العدل والتنمية المتوازنة.<br><b>الوضعي</b>: يقوم على <b>النفعية المادية</b> وتحقيق أقصى ربح ممكن <b>دون اعتبار القيم</b>."],
[4,"الفصل 12","الاختلاف في أسلوب التمويل","<b>الإسلامي</b>: المشاركة في الربح والخسارة عبر صيغ:<br><span class='k'>المضاربة</span> <span class='k'>المشاركة</span> <span class='k'>المزارعة</span> <span class='k'>المساقاة</span><br><b>الوضعي</b>: القرض بفائدة ثابتة <b>بغض النظر عن نتيجة المشروع</b>، والفائدة ثمن استخدام رأس المال."],
[4,"الفصل 12","الاختلاف في العدالة الاجتماعية","<b>الإسلامي</b>: يسعى لتوزيع عادل للثروة عبر <b>الزكاة والوقف والصدقات</b>.<br><b>الوضعي</b>: <b>لا يراعي توزيع الثروة</b>، بل يركز على الكفاءة الإنتاجية والعائد."],
[4,"الفصل 12","الاختلاف في الجانب الأخلاقي","<b>الإسلامي</b>: التمويل مرتبط بالقيم: <b>الصدق، الأمانة، تجنب الغرر والاحتكار</b>.<br><b>الوضعي</b>: يفتقر إلى الضوابط الأخلاقية؛ <b>ما دام النشاط قانونيًا فهو مقبول</b>."],
[4,"الفصل 12","الاختلاف في مجال الاستثمار","<b>الإسلامي</b>: يجب أن يكون في <b>مجالات حلال ومنتجة</b> تحقق المنفعة العامة.<br><b>الوضعي</b>: يمكن أن يكون في <b>أي نشاط يحقق ربحًا</b> حتى لو كان ضارًا بالمجتمع."],
[4,"الفصل 12","العلاقة بين المال والعمل","<b>الإسلامي</b>: <span class='k'>تكامل وتفاعل</span> بين المال والعمل.<br><b>الوضعي</b>: <span class='k'>فصل تام</span> ← المال وحده يدرّ الربح.<br>ومن هنا عُلّل تحريم الربا: <b>لا يجوز أن يدرّ المال مالًا بلا مخاطرة أو عمل</b>."],
[4,"الفصل 14","نشأة التخطيط: البدايات","بدأ مع <b>استقرار الإنسان</b>، وتطور مع <b>الثورة الصناعية</b>.<br><b>1910م</b>: أول استخدام علمي للتخطيط الاستراتيجي على يد العالم النرويجي <b>كريستيان شونهيدر</b>.<br><b>1914م</b>: أول استخدام عملي في <b>ألمانيا</b> خلال الحرب العالمية الأولى."],
[4,"الفصل 14","التخطيط بعد الحرب الثانية واليوم","توسعت الدول في تطبيقه <b>بعد الحرب العالمية الثانية</b> عبر <b>مشروع مارشال</b> لمواجهة مشكلات الحرب.<br><b>اليوم</b>: أصبح يهتم بدراسة <b>الأهداف الاجتماعية والاقتصادية</b> = أحدث اتجاهات التخطيط."],
[4,"الفصل 14","خصائص التخطيط وضوابطه","<ol><li>إعطاؤه <b>الأولوية</b> في النظام الإداري</li><li><b>الواقعية</b></li><li><b>الشمولية</b></li><li><b>التناسق والانسجام</b> بين الأهداف</li><li><b>المرونة</b></li><li><b>الإلزامية</b></li></ol>"],
[4,"الفصل 14","الموازين السلعية","تركز على <b>سلع محددة</b> مثل القمح أو النفط.<br>توازن بين <b>مصادرها</b> (الإنتاج المحلي، الواردات) و<b>استخداماتها</b> (الاستهلاك النهائي، التصدير)."],
[4,"الفصل 14","الموازين القيمية: المستوى الجزئي","على مستوى <b>المنشأة</b> تُعرف بـ<span class='k'>الموازنة التقديرية</span>:<br><b>ترجمة مالية لأهداف المنشأة</b>، تهدف إلى التوازن بين <b>الإيرادات والمصروفات</b>."],
[4,"الفصل 14","الموازين القيمية: المستوى الكلي","على مستوى <b>الدولة</b> تُعدّ <b>القيد الحاكم للخطة</b>، وتشمل:<ul><li><b>ميزانية الدولة</b>: الإيرادات والنفقات العامة</li><li><b>ميزان المدفوعات</b>: التدفقات النقدية مع الخارج</li><li><b>الموازنة النقدية</b>: لإدارة السيولة وضمان تنفيذ الموازنة العامة على أساس نقدي</li></ul>"],
[4,"الفصل 14","موازين القوى العاملة","تطورت من <b>موازنة أعداد العمال</b> إلى <b>التخطيط الاستراتيجي للقوى العاملة</b>:<br>تحليل <b>الطلب المستقبلي</b> (المهارات المطلوبة) و<b>العرض الحالي</b> (المهارات المتاحة) ← تحديد <b>الفجوة</b> (فائض أو عجز) لتحقيق التوازن."],
[4,"الفصل 14","أسلوب المدخلات والمخرجات","يحلل <b>التشابك والاعتماد المتبادل</b> بين القطاعات الاقتصادية.<br>يُستخدم لـ<b>تحليل الأثر</b>: قياس الآثار المباشرة وغير المباشرة لأي تغيير في الطلب (كاستثمار جديد) على الإنتاج والواردات والعمالة.<br>وتقدير انتشار <b>صدمات التكلفة</b> كارتفاع أسعار المحروقات."],
[4,"الفصل 14","أسلوب البرمجة الخطية","أسلوب <b>رياضي</b> هدفه <span class='k'>المثالية</span>: إيجاد <b>الحل الأمثل</b> الذي يحقق:<ul><li>إما <b>تعظيم</b> هدف مرغوب كالربح أو الإيراد</li><li>أو <b>تخفيض</b> هدف غير مرغوب كالتكاليف</li></ul>"],
[4,"الفصل 15","حوكمة التخطيط وآليات الرؤية","<b>مجلس الشؤون الاقتصادية والتنمية</b>: العقل المدبر الذي يوحّد توجهات الدولة.<br><b>وزارة الاقتصاد والتخطيط</b>: الجهة الفنية لوضع الخطط.<br><b>التنفيذ</b>: برامج تحقيق الرؤية، مثل تطوير الصناعة الوطنية والخدمات اللوجستية، وصندوق الاستثمارات العامة، وتنمية القدرات البشرية، والاستدامة المالية.<br><b>المتابعة</b>: مؤشرات الأداء الرئيسة."]
];
const CARDS=C.map((c,i)=>({lv:c[0],ch:c[1],t:c[2],b:c[3]}));
LEVELS.forEach(L=>{let k=0;CARDS.forEach(c=>{if(c.lv===L.n)c.id='L'+L.n+'-'+(++k);});L.total=k;});

const KEY='tanmiya-cards-v1';
let S={done:{},level:1,order:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const byLv=n=>CARDS.filter(c=>c.lv===n);
const doneCount=n=>byLv(n).filter(c=>S.done[c.id]).length;
const lvComplete=n=>doneCount(n)===byLv(n).length;
const unlocked=n=>n===1||lvComplete(n-1);
function queue(n){ // order of pending cards (supports "later")
  const ids=byLv(n).map(c=>c.id);
  let o=(S.order[n]||[]).filter(id=>ids.includes(id));
  ids.forEach(id=>{if(!o.includes(id))o.push(id)});
  S.order[n]=o;return o.filter(id=>!S.done[id]);
}
let viewId=null; // card opened explicitly (e.g., from list)
let hist=[];

function render(){
  const tot=CARDS.length,d=CARDS.filter(c=>S.done[c.id]).length;
  ovTxt.textContent=d+' / '+tot+' بطاقة';ovBar.style.width=(d/tot*100)+'%';
  levels.innerHTML=LEVELS.map(L=>{
    const dc=doneCount(L.n),cls=['lv'];if(L.n===S.level)cls.push('on');if(lvComplete(L.n))cls.push('done');if(!unlocked(L.n))cls.push('locked');
    return `<button class="${cls.join(' ')}" data-l="${L.n}">${lvComplete(L.n)?'<span class="badge">✓</span>':''}${unlocked(L.n)?'':'🔒 '}م${L.n}<small>${L.name}</small><small>${dc} / ${L.total}</small><div class="mini"><i style="width:${dc/L.total*100}%"></i></div></button>`}).join('');
  const L=LEVELS[S.level-1];const q=queue(S.level);
  let card=viewId?CARDS.find(c=>c.id===viewId):null;
  if(!card&&q.length)card=CARDS.find(c=>c.id===q[0]);
  if(!card){
    const next=LEVELS[S.level];
    stage.innerHTML=`<div class="finish anim"><div class="big">🎉</div><h2>أتممت المستوى ${S.level}: ${L.name}</h2>
      <p>${next?`فهمت جميع بطاقاته (${L.total}). المستوى التالي «${next.name}» فيه ${next.total} بطاقة ويأخذك أعمق في المنهج.`:'أنهيت البطاقات المئة كلها. أنت الآن ملمّ بالمقرر من الصورة الكبرى إلى أدق التفاصيل.'}</p>
      ${next?`<button class="btn ok" id="goNext">انتقل إلى المستوى ${next.n} ←</button>`:''}
      <button class="btn later" id="review">راجع بطاقات هذا المستوى</button></div>`;
    const g=document.getElementById('goNext');if(g)g.onclick=()=>{S.level++;viewId=null;hist=[];save();render();};
    document.getElementById('review').onclick=openList;
    save();return;
  }
  const idx=byLv(S.level).indexOf(card)+1;const isDone=!!S.done[card.id];
  stage.innerHTML=`<div class="card anim">
    ${isDone?'<span class="done-tag">✓ تمت</span>':''}
    <div class="meta"><span class="chap">${card.ch}</span><span class="count">المستوى ${S.level} · بطاقة ${idx} من ${L.total}</span></div>
    <h2>${card.t}</h2><div class="body">${card.b}</div>
    <div class="actions">
      <button class="btn later" id="later">${isDone?'إلغاء «تم»':'لاحقًا'}</button>
      <button class="btn ok" id="ok">${isDone?'التالية ←':'✓ تم، فهمتها'}</button>
    </div>
    <div class="nav"><button class="link" id="back" ${hist.length?'':'disabled'}>→ السابقة</button><span class="count">بقي ${q.length} في هذا المستوى</span></div>
  </div>`;
  ok.onclick=()=>{hist.push(card.id);if(!isDone){S.done[card.id]=true;toast('أحسنت! ✓');}viewId=null;save();render();};
  later.onclick=()=>{
    if(isDone){delete S.done[card.id];viewId=card.id;save();render();return;}
    const o=S.order[S.level];o.splice(o.indexOf(card.id),1);o.push(card.id);hist.push(card.id);viewId=null;
    if(queue(S.level).length>1)toast('ستعود إليها لاحقًا');save();render();};
  back.onclick=()=>{const id=hist.pop();if(id){viewId=id;render();}};
}
levels.onclick=e=>{const b=e.target.closest('.lv');if(!b)return;const n=+b.dataset.l;
  if(!unlocked(n)){toast('أكمل المستوى '+(n-1)+' أولًا');return;}S.level=n;viewId=null;hist=[];save();render();};

function openList(){
  const L=LEVELS[S.level-1];const q=queue(S.level);const cur=viewId||q[0];
  sheet.innerHTML=`<h3><span>المستوى ${L.n}: ${L.name}</span><button class="link" id="cls">إغلاق ✕</button></h3>`+
   byLv(S.level).map((c,i)=>`<div class="item ${S.done[c.id]?'d':''} ${c.id===cur?'cur':''}" data-id="${c.id}"><span class="st">${S.done[c.id]?'✓':''}</span><span>${i+1}. ${c.t}</span></div>`).join('')+
   `<button class="danger" id="rst">إعادة تعيين تقدّم هذا المستوى</button>
    <div class="confirm" id="cf"><button style="background:#9c3d3d;color:#fff" id="yes">نعم، أعد التعيين</button><button style="background:var(--tealL);color:var(--teal)" id="no">تراجع</button></div>`;
  sheetBg.classList.add('show');
  sheet.querySelectorAll('.item').forEach(it=>it.onclick=()=>{viewId=it.dataset.id;hist=[];closeList();render();});
  cls.onclick=closeList;rst.onclick=()=>cf.classList.add('show');no.onclick=()=>cf.classList.remove('show');
  yes.onclick=()=>{byLv(S.level).forEach(c=>delete S.done[c.id]);delete S.order[S.level];viewId=null;hist=[];save();closeList();render();toast('بدأ المستوى من جديد');};
}
function closeList(){sheetBg.classList.remove('show');}
listBtn.onclick=openList;sheetBg.onclick=e=>{if(e.target===sheetBg)closeList();};
let tt;function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),1400);}
const toastEl=document.getElementById('toast');
if(!unlocked(S.level))S.level=1;
render();
</script>
</body>
